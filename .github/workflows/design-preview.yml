name: Design preview

on:
  push:
    branches:
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site for preview hosting
        run: |
          bundle exec jekyll build \
            --baseurl "/aioue/aioue.github.io/design-preview" \
            --url "https://raw.githack.com"

      - name: Verify preview asset paths
        run: |
          rg -q 'href="/aioue/aioue.github.io/design-preview/assets/main.css"' _site/index.html

      - name: Deploy to design-preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: design-preview
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'deploy: design preview from ${{ github.ref_name }}'
